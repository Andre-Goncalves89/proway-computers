<h2 class="cart-title">Carrinho</h2>

<div *ngIf="itens.length > 0; else semItens">
  <ul>
    <li *ngFor="let item of itens">
      <img [src]="item.imagem" [alt]="item.descricao" />
      <p>{{ item.descricao }}</p>
      <p>Preço: {{ item.preco | currency: 'BRL'}}</p>
      <label>
        Quantidade:
        <input type="number" [(ngModel)]="item.quantidade" min="1" (change)="calcularTotal()" />
      </label>
      <button type="button" class="delete-button" (click)="removerProdutoCarrinho(item.id)">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </li>
  </ul>

  <h2 class="cart-total">Total: {{ total | currency: 'BRL'}}</h2>
  <button type="button" class="buy-button" (click)="comprar()">Comprar</button>
</div>

<ng-template #semItens>
  <p class="cart-empty">Seu carrinho está vazio.</p>
</ng-template>
